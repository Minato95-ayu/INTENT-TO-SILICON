name: Cross-Platform Native Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-native:
    name: Build Native Installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: aayu-linux.tar.gz
            asset_name: aayu-linux.tar.gz
          - os: windows-latest
            artifact_name: aayu.exe
            asset_name: aayu.exe
          - os: macos-latest
            artifact_name: aayu-macos.pkg
            asset_name: aayu-macos.pkg

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Create Build Entry
        shell: bash
        run: |
          echo "import sys" > build_entry.py
          echo "from tools.cli import main" >> build_entry.py
          echo "if __name__ == '__main__':" >> build_entry.py
          echo "    sys.exit(main())" >> build_entry.py

      - name: Build Native Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller --onefile --name aayu --collect-all tools --collect-all compiler --collect-all runtime build_entry.py

      - name: Build Native Binary (Linux/Mac)
        if: matrix.os != 'windows-latest'
        run: pyinstaller --onefile --name aayu --collect-all tools --collect-all compiler --collect-all runtime build_entry.py

      - name: Package Linux (tar.gz)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd dist
          tar -czvf aayu-linux.tar.gz aayu

      - name: Package macOS (zip)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip aayu-macos.zip aayu
          # We provide a zip for Mac as building pkg requires extra Apple certificates.

      - name: Rename and Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aayu.exe
            dist/aayu-linux.tar.gz
            dist/aayu-macos.zip

