<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <div class="flex h-screen bg-gray-50 overflow-hidden w-full">
            <section class="component-appsidebar mb-8">
                <aside class="w-64 bg-gray-900 text-white min-h-screen p-6 shadow-xl flex-shrink-0">
                    <p class="text-lg text-gray-700 mb-4 leading-relaxed">Home</p>
                    <p class="text-lg text-gray-700 mb-4 leading-relaxed">Patients</p>
                    <p class="text-lg text-gray-700 mb-4 leading-relaxed">Appointments</p>
                    <p class="text-lg text-gray-700 mb-4 leading-relaxed">Billing</p>
                    <p class="text-lg text-gray-700 mb-4 leading-relaxed">Dashboard</p>
                    <p class="text-lg text-gray-700 mb-4 leading-relaxed">Login</p>
                </aside>
            </section>
            <div class="flex flex-col gap-4 mb-6">
                <nav class="bg-white shadow-sm border border-gray-200 rounded-xl px-6 py-4 mb-8 flex justify-between items-center"><div class="text-xl font-bold text-blue-600">Logo</div><div class="space-x-4"><a href="#" class="text-gray-600 hover:text-gray-900">Home</a><a href="#" class="text-gray-600 hover:text-gray-900">About</a></div></nav>
                <div class="flex flex-row flex-wrap gap-6 mb-6">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6 hover:shadow-md transition">
                        <h1 class="text-4xl font-bold text-gray-900 mb-6">Welcome to HospitalApp</h1>
                        <p class="text-lg text-gray-700 mb-4 leading-relaxed">System Overview and Analytics</p>
                        <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg shadow-sm transition duration-150 ease-in-out">Get Started</button>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6 hover:shadow-md transition">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-6"><h3 class="text-lg font-medium text-gray-900 mb-4">System Activity</h3><div class="h-64 flex items-center justify-center text-gray-400 bg-gray-50 rounded border border-dashed border-gray-200">[ Chart Container ]</div></div>
                    </div>
                </div>
                <div class="bg-white shadow-sm rounded-xl border border-gray-100 mb-6 overflow-hidden"><div class="px-6 py-4 border-b border-gray-200"><h3 class="text-lg font-medium text-gray-900">Patient Records</h3></div><div class="overflow-x-auto"><table class="min-w-full divide-y divide-gray-200"><tbody class="bg-white divide-y divide-gray-200"></tbody></table></div></div>
                <div class="bg-white shadow-sm rounded-xl border border-gray-100 mb-6 overflow-hidden"><div class="px-6 py-4 border-b border-gray-200"><h3 class="text-lg font-medium text-gray-900">Doctor Records</h3></div><div class="overflow-x-auto"><table class="min-w-full divide-y divide-gray-200"><tbody class="bg-white divide-y divide-gray-200"></tbody></table></div></div>
                <div class="bg-white shadow-sm rounded-xl border border-gray-100 mb-6 overflow-hidden"><div class="px-6 py-4 border-b border-gray-200"><h3 class="text-lg font-medium text-gray-900">Appointment Records</h3></div><div class="overflow-x-auto"><table class="min-w-full divide-y divide-gray-200"><tbody class="bg-white divide-y divide-gray-200"></tbody></table></div></div>
                <div class="bg-white shadow-sm rounded-xl border border-gray-100 mb-6 overflow-hidden"><div class="px-6 py-4 border-b border-gray-200"><h3 class="text-lg font-medium text-gray-900">Prescription Records</h3></div><div class="overflow-x-auto"><table class="min-w-full divide-y divide-gray-200"><tbody class="bg-white divide-y divide-gray-200"></tbody></table></div></div>
                <div class="bg-white shadow-sm rounded-xl border border-gray-100 mb-6 overflow-hidden"><div class="px-6 py-4 border-b border-gray-200"><h3 class="text-lg font-medium text-gray-900">Billing Records</h3></div><div class="overflow-x-auto"><table class="min-w-full divide-y divide-gray-200"><tbody class="bg-white divide-y divide-gray-200"></tbody></table></div></div>
            </div>
        </div>
    </div>
</body>
</html>
