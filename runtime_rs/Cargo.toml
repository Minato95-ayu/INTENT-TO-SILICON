[package]
name = "aayu-vm"
version = "0.3.1"
edition = "2021"
authors = ["Ayush Ghrit Kaushik <minato95.ayu@gmail.com>"]
description = "The extreme-performance native Rust Virtual Machine for AAYU"
default-run = "aayu"

[dependencies]
# Zero overhead, zero heavy dependencies for maximum speed
byteorder = "1.5" # For fast bytecode decoding

# Lightweight HTTP client (Blocking) - Native Web API Implant
ureq = { version = "2.9", features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.15"
rustls-pemfile = "2.2"
rcgen = "0.14"

[build-dependencies]
winres = "0.1"

[[bin]]
name = "aayu"
path = "src/main.rs"

[[bin]]
name = "aayu-vm"
path = "src/main.rs"

[[bin]]
name = "aayuc"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
