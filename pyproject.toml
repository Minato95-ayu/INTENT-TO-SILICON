[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aayu-lang"
version = "1.0.0"
description = "AAYU: The Intent-to-Silicon Programming Language"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Ayush Kaushik", email = "ayushkaushi1441@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers"
]
dependencies = ["pyinstaller>=5.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "pyinstaller>=5.0"
]

[project.scripts]
aayu = "tools.cli:main"

[project.urls]
Repository = "https://github.com/Minato95-ayu/INTENT-TO-SILICON"
Documentation = "https://aayu-lang.github.io"

[tool.setuptools]
packages = ["compiler", "compiler.lexer", "compiler.parser", "compiler.ast", "compiler.semantic", "runtime", "runtime.vm", "tools", "tools.commands", "tools.package_manager", "tools.builder", "tools.builder.targets", "tools.lsp", "brainos", "intent_engine"]
