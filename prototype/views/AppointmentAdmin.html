<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppointmentAdmin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <div class="flex h-screen bg-gray-50 overflow-hidden w-full">
            <aside class="w-64 bg-gray-900 text-white min-h-screen p-6 shadow-xl flex-shrink-0">
                <p class="text-lg text-gray-700 mb-4 leading-relaxed">Appointment Management</p>
            </aside>
            <div class="flex flex-col gap-4 mb-6">
                <nav class="bg-white shadow-sm border border-gray-200 rounded-xl px-6 py-4 mb-8 flex justify-between items-center"><div class="text-xl font-bold text-blue-600">Logo</div><div class="space-x-4"><a href="#" class="text-gray-600 hover:text-gray-900">Home</a><a href="#" class="text-gray-600 hover:text-gray-900">About</a></div></nav>
                <div class="flex flex-row flex-wrap gap-6 mb-6">
                    <div class="bg-white shadow-sm rounded-xl border border-gray-100 mb-6 overflow-hidden"><div class="px-6 py-4 border-b border-gray-200"><h3 class="text-lg font-medium text-gray-900">Appointment Records</h3></div><div class="overflow-x-auto"><table class="min-w-full divide-y divide-gray-200"><thead><tr><th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th><th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created At</th><th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Patient Id</th><th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Doctor Id</th><th class="px-6 py-3 bg-gray-50 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th></tr></thead><tbody class="bg-white divide-y divide-gray-200"></tbody></table></div></div>
                    <form class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 mb-6">
                        <div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-1">Name</label><input type="text" name="name" class="border border-gray-300 rounded-lg px-4 py-2 w-full focus:ring-blue-500 focus:border-blue-500 transition" /></div>
                        <div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-1">Patient Id</label><input type="text" name="patient_id" class="border border-gray-300 rounded-lg px-4 py-2 w-full focus:ring-blue-500 focus:border-blue-500 transition" /></div>
                        <div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-1">Doctor Id</label><input type="text" name="doctor_id" class="border border-gray-300 rounded-lg px-4 py-2 w-full focus:ring-blue-500 focus:border-blue-500 transition" /></div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg mt-4 transition">Save Appointment</button></form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
