<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <h1 class="text-4xl font-bold text-gray-900 mb-6">Police System Dashboard</h1>
        <div class="flex flex-row flex-wrap gap-6 mb-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6 hover:shadow-md transition">
                <h1 class="text-4xl font-bold text-gray-900 mb-6">Complaints</h1>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6 hover:shadow-md transition">
                <h1 class="text-4xl font-bold text-gray-900 mb-6">Officers</h1>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6 hover:shadow-md transition">
                <h1 class="text-4xl font-bold text-gray-900 mb-6">Citizens</h1>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6 hover:shadow-md transition">
                <h1 class="text-4xl font-bold text-gray-900 mb-6">Evidences</h1>
            </div>
        </div>
    </div>
</body>
</html>
