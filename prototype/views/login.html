<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <div class="flex h-screen bg-gray-50 overflow-hidden w-full">
            <section class="component-appsidebar mb-8">
                <aside class="w-64 bg-gray-900 text-white min-h-screen p-6 shadow-xl flex-shrink-0">
                    <p class="text-lg text-gray-700 mb-4 leading-relaxed">Home</p>
                    <p class="text-lg text-gray-700 mb-4 leading-relaxed">Patients</p>
                    <p class="text-lg text-gray-700 mb-4 leading-relaxed">Appointments</p>
                    <p class="text-lg text-gray-700 mb-4 leading-relaxed">Billing</p>
                    <p class="text-lg text-gray-700 mb-4 leading-relaxed">Dashboard</p>
                    <p class="text-lg text-gray-700 mb-4 leading-relaxed">Login</p>
                </aside>
            </section>
            <div class="flex flex-col gap-4 mb-6">
                <nav class="bg-white shadow-sm border border-gray-200 rounded-xl px-6 py-4 mb-8 flex justify-between items-center"><div class="text-xl font-bold text-blue-600">Logo</div><div class="space-x-4"><a href="#" class="text-gray-600 hover:text-gray-900">Home</a><a href="#" class="text-gray-600 hover:text-gray-900">About</a></div></nav>
                <form class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 mb-6">
                    <h1 class="text-4xl font-bold text-gray-900 mb-6">Sign In</h1>
                    <input type="text" placeholder="Email Address" name="login_email" class="border border-gray-300 rounded-lg px-4 py-3 w-full mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
                    <input type="text" placeholder="Password" name="login_password" class="border border-gray-300 rounded-lg px-4 py-3 w-full mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
                    <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg shadow-sm transition duration-150 ease-in-out">Authenticate</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
