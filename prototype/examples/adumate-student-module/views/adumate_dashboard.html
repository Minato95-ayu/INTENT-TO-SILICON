<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student Dashboard">
    <title>Dashboard | Adumate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090b11;
            --surface: rgba(17, 22, 37, 0.7);
            --surface-hover: rgba(30, 36, 56, 0.8);
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: #6366f1;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #10b981;
            --danger: #ef4444;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            border-bottom: 1px solid var(--border);
            background: rgba(9, 11, 17, 0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .user-greeting {
            font-size: 14px;
            color: var(--text-muted);
            margin-right: 16px;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 32px;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 32px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(8px);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            color: var(--text-muted);
        }

        input {
            background: rgba(10, 14, 26, 0.8);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--border-focus);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }

        /* Lists and Tables */
        .search-bar {
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
        }

        .search-bar input {
            flex: 1;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        th {
            color: var(--text-muted);
            font-weight: 500;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .badge {
            background: rgba(99, 102, 241, 0.1);
            color: #a5b4fc;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .saved-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .saved-item:last-child {
            border-bottom: none;
        }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .btn-danger:hover {
            text-decoration: underline;
        }

        .action-form {
            margin: 0;
            display: inline;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<nav>
    <a href="/" class="logo">Adumate</a>
    <div class="nav-links">
        <span class="user-greeting" id="greeting">Welcome</span>
        <form action="/logout" method="post" style="margin:0;">
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <!-- Left Column: Profile & Bookmarks -->
    <div class="side-col">
        <!-- Profile Card -->
        <div class="card" style="margin-bottom: 24px;">
            <h2 class="card-title">My Profile</h2>
            <form action="/update_profile" method="post">
                <div class="form-group">
                    <label>Email</label>
                    <input type="text" id="prof-email" disabled>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" id="prof-name" required>
                </div>
                <div class="form-group">
                    <label>College</label>
                    <input type="text" name="college" id="prof-college" required>
                </div>
                <div class="form-group">
                    <label>Branch</label>
                    <input type="text" name="branch" id="prof-branch" required>
                </div>
                <div class="form-group">
                    <label>Year</label>
                    <input type="text" name="year" id="prof-year" required>
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 8px;">Update Profile</button>
            </form>
        </div>

        <!-- Saved Colleges Card -->
        <div class="card">
            <h2 class="card-title">Bookmarked Colleges</h2>
            <div id="saved-list">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <!-- Right Column: College Search -->
    <div class="main-col">
        <div class="card">
            <h2 class="card-title">Discover Colleges</h2>
            
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search by name or location...">
                <button class="btn-primary" style="width: auto;" onclick="searchColleges()">Search</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>College Name</th>
                            <th>Location</th>
                            <th>Course</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="colleges-table-body">
                        <!-- Injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // Data injected by AAYU
    let student = {{ student }};
    let savedColleges = {{ saved_colleges }};
    let allColleges = {{ colleges }};

    if (student && Array.isArray(student) && student.length > 0) student = student[0];
    if (savedColleges && Array.isArray(savedColleges) && savedColleges.length > 0 && Array.isArray(savedColleges[0])) savedColleges = savedColleges[0];
    if (allColleges && Array.isArray(allColleges) && allColleges.length > 0 && Array.isArray(allColleges[0])) allColleges = allColleges[0];

    // Populate Profile
    if (student) {
        document.getElementById('greeting').textContent = 'Welcome, ' + (student.name || 'Student');
        document.getElementById('prof-email').value = student.email || '';
        document.getElementById('prof-name').value = student.name || '';
        document.getElementById('prof-college').value = student.college || '';
        document.getElementById('prof-branch').value = student.branch || '';
        document.getElementById('prof-year').value = student.year || '';
    }

    // Populate Saved Colleges
    const savedList = document.getElementById('saved-list');
    if (!savedColleges || savedColleges.length === 0) {
        savedList.innerHTML = '<div style="color:var(--text-muted); font-size:14px; text-align:center; padding:12px 0;">No saved colleges yet.</div>';
    } else {
        savedColleges.forEach(item => {
            const div = document.createElement('div');
            div.className = 'saved-item';
            div.innerHTML = `
                <span style="font-size:14px; font-weight:500;">${item.college_name}</span>
                <form class="action-form" action="/delete_college" method="post">
                    <input type="hidden" name="id" value="${item.id}">
                    <button type="submit" class="btn-danger">Remove</button>
                </form>
            `;
            savedList.appendChild(div);
        });
    }

    // Populate All Colleges Table
    const tbody = document.getElementById('colleges-table-body');
    
    function renderColleges(data) {
        tbody.innerHTML = '';
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">No colleges found.</td></tr>';
            return;
        }

        // Quick check for already saved to disable button
        const savedNames = new Set((savedColleges || []).map(s => s.college_name));

        data.forEach(c => {
            const tr = document.createElement('tr');
            
            const isSaved = savedNames.has(c.name);
            
            let actionHtml = '';
            if (isSaved) {
                actionHtml = `<span style="color:var(--secondary); font-size:13px; font-weight:500;">Bookmarked ✓</span>`;
            } else {
                actionHtml = `
                    <form class="action-form" action="/save_college" method="post">
                        <input type="hidden" name="college_name" value="${c.name}">
                        <button type="submit" class="btn-primary btn-sm" style="width:auto; padding:4px 10px;">Save</button>
                    </form>
                `;
            }

            tr.innerHTML = `
                <td style="font-weight:500;">${c.name}</td>
                <td style="color:var(--text-muted);">${c.location}</td>
                <td><span class="badge">${c.course}</span></td>
                <td>${actionHtml}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Initial render
    renderColleges(allColleges);

    // Search function mapping to API endpoint
    async function searchColleges() {
        const q = document.getElementById('search-input').value.trim();
        try {
            const res = await fetch('/api/colleges?q=' + encodeURIComponent(q));
            if (res.ok) {
                const data = await res.json();
                renderColleges(data);
            } else {
                console.error("API error");
            }
        } catch(e) {
            console.error("Fetch error", e);
        }
    }

    // Also search on enter key
    document.getElementById('search-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            searchColleges();
        }
    });

</script>

</body>
</html>
