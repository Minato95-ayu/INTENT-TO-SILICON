name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  engine-tests:
    name: Native AAYU Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run VM unit tests
        run: cargo test --manifest-path runtime_rs/Cargo.toml

      - name: Build release engine
        run: cargo build --release --manifest-path runtime_rs/Cargo.toml

      - name: Verify CLI & benchmarks on Windows
        if: matrix.os == 'windows-latest'
        run: |
          .\runtime_rs\target\release\aayu-vm.exe --version
          .\runtime_rs\target\release\aayu-vm.exe --help
          .\runtime_rs\target\release\aayu-vm.exe --sum 1000000
          .\runtime_rs\target\release\aayu-vm.exe hello.ayc
          .\runtime_rs\target\release\aayu-vm.exe examples/test_pure_std.ayc
        shell: powershell

      - name: Verify CLI & benchmarks on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./runtime_rs/target/release/aayu-vm --version
          ./runtime_rs/target/release/aayu-vm --help
          ./runtime_rs/target/release/aayu-vm --sum 1000000
          ./runtime_rs/target/release/aayu-vm hello.ayc
          ./runtime_rs/target/release/aayu-vm examples/test_pure_std.ayc

  website-build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build
