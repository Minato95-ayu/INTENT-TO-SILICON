[workspace]
members = [
    "crates/aayu_core",
    "crates/aayu_vm",
    "crates/aayu_stdlib",
    "crates/aayu_db",
    "crates/aayu_server",
    "crates/aayu_diagnostics",
    "crates/aayu_cli",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
