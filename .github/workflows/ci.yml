name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  engine-tests:
    name: Native AAYU Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run VM unit tests
        run: cargo test --manifest-path runtime_rs/Cargo.toml

      - name: Build release engine
        run: cargo build --release --manifest-path runtime_rs/Cargo.toml

      - name: Verify CLI & Run Security Test Suite on Windows
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          Copy-Item .\runtime_rs\target\release\aayu-vm.exe bin\aayu-vm.exe -Force
          Copy-Item .\runtime_rs\target\release\aayu-vm.exe bin\aayu.exe -Force
          .\bin\aayu.exe --version
          .\bin\aayu.exe --help
          .\bin\aayu.exe --sum 1000000
          powershell -ExecutionPolicy Bypass -File tests/test_malformed_bytecode.ps1
          powershell -ExecutionPolicy Bypass -File tests/run_tests.ps1
        shell: powershell

      - name: Verify CLI on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./runtime_rs/target/release/aayu-vm --version
          ./runtime_rs/target/release/aayu-vm --help
          ./runtime_rs/target/release/aayu-vm --sum 1000000
          # Run malformed rejection test on Linux
          echo "BAD_MAGIC" > bad.ayc
          if ./runtime_rs/target/release/aayu-vm run bad.ayc; then
            echo "Security vulnerability: bad magic was not rejected!"
            exit 1
          else
            echo "PASS: bad magic safely rejected on Linux"
          fi

  website-build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build
