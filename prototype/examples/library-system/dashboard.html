<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AAYU Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <nav class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-2">
                    <span class="font-bold text-xl tracking-tight">AAYU Library</span>
                </div>
                <div class="flex space-x-4">
                    <a href="/dashboard" class="px-3 py-2 rounded-md text-sm font-medium bg-blue-700">Dashboard</a>
                    <a href="/books" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-500 transition-colors">Books</a>
                    <a href="/students" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-500 transition-colors">Students</a>
                    <a href="/issue" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-500 transition-colors">Issue Book</a>
                    <a href="/logout" class="px-3 py-2 rounded-md text-sm font-medium text-blue-100 hover:text-white hover:bg-blue-800 transition-colors">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">Dashboard Overview</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-sm font-medium text-gray-500 mb-1">Total Books</h3>
                <p class="text-3xl font-bold text-gray-900">{{ total_books }}</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-sm font-medium text-gray-500 mb-1">Total Students</h3>
                <p class="text-3xl font-bold text-gray-900">{{ total_students }}</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-sm font-medium text-gray-500 mb-1">Books Issued</h3>
                <p class="text-3xl font-bold text-blue-600">{{ books_issued }}</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-sm font-medium text-gray-500 mb-1">Books Available</h3>
                <p class="text-3xl font-bold text-emerald-600">{{ books_available }}</p>
            </div>
        </div>
        
        <div class="bg-white shadow-sm border border-gray-100 rounded-xl overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-gray-800">Quick Actions</h2>
            </div>
            <div class="p-6 flex gap-4">
                <a href="/books" class="bg-blue-50 text-blue-700 px-4 py-3 rounded-lg font-medium hover:bg-blue-100 transition-colors">Add New Book</a>
                <a href="/students" class="bg-indigo-50 text-indigo-700 px-4 py-3 rounded-lg font-medium hover:bg-indigo-100 transition-colors">Register Student</a>
                <a href="/issue" class="bg-emerald-50 text-emerald-700 px-4 py-3 rounded-lg font-medium hover:bg-emerald-100 transition-colors">Issue a Book</a>
            </div>
        </div>
    </main>
</body>
</html>
