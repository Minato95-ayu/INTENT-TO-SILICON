name: Cross-Platform Native Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-native:
    name: Build Native Installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build Native Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller --clean --onefile --name aayu --hidden-import runtime.renderers.web_renderer --hidden-import uvicorn --hidden-import fastapi --hidden-import starlette --hidden-import pydantic --hidden-import anyio build_entry.py

      - name: Build Native Binary (Linux/Mac)
        if: matrix.os != 'windows-latest'
        run: pyinstaller --clean --onefile --name aayu --hidden-import runtime.renderers.web_renderer --hidden-import uvicorn --hidden-import fastapi --hidden-import starlette --hidden-import pydantic --hidden-import anyio build_entry.py

      - name: Package Linux (tar.gz)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd dist
          tar -czvf aayu-linux.tar.gz aayu

      - name: Package macOS (zip)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip aayu-macos.zip aayu

      - name: Rename and Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aayu.exe
            dist/aayu-linux.tar.gz
            dist/aayu-macos.zip