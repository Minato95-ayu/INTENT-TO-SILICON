<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1F36" />
      <stop offset="100%" stop-color="#090B14" />
    </linearGradient>

    <!-- Foreground Neon Gradient -->
    <linearGradient id="neonGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF0055" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Plate (Optional for file icons, some prefer no background, but standardizing it in a squircle is nice) -->
  <rect x="16" y="16" width="224" height="224" rx="50" fill="url(#bgGrad)" />
  
  <!-- Outer Circuit Ring -->
  <circle cx="128" cy="128" r="90" fill="none" stroke="#2A304D" stroke-width="8" stroke-dasharray="20 10 50 10" />

  <!-- The stylized 'A' -->
  <path d="M 128 60 
           L 180 180 
           L 145 180 
           L 128 140
           L 111 180
           L 76 180 
           Z
           M 128 110
           L 118 135
           L 138 135
           Z" 
        fill="url(#neonGrad)" 
        filter="url(#glow)" />
        
  <!-- Silicon Node Dots -->
  <circle cx="128" cy="60" r="8" fill="#00F0FF" />
  <circle cx="180" cy="180" r="8" fill="#FF0055" />
  <circle cx="76" cy="180" r="8" fill="#7000FF" />
</svg>
