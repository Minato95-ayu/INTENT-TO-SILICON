[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aayu-lang"
version = "1.0.0"
description = "AAYU: The Intent-to-Silicon Programming Language"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Ayush Kaushik", email = "ayushkaushi1441@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers"
]
dependencies = ["pyinstaller>=5.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "pyinstaller>=5.0"
]
lsp = [
    "pygls>=1.3",
    "lsprotocol>=2023.0.1"
]

[project.scripts]
aayu = "aayu.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.setuptools.packages.find]
where = ["."]
include = ["aayu*", "brainos*", "intent_engine*"]
