<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books - AAYU Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <nav class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-2">
                    <span class="font-bold text-xl tracking-tight">AAYU Library</span>
                </div>
                <div class="flex space-x-4">
                    <a href="/dashboard" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-500 transition-colors">Dashboard</a>
                    <a href="/books" class="px-3 py-2 rounded-md text-sm font-medium bg-blue-700">Books</a>
                    <a href="/students" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-500 transition-colors">Students</a>
                    <a href="/issue" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-500 transition-colors">Issue Book</a>
                    <a href="/logout" class="px-3 py-2 rounded-md text-sm font-medium text-blue-100 hover:text-white hover:bg-blue-800 transition-colors">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Manage Books</h1>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Add Book Form -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="bg-blue-50 px-6 py-4 border-b border-gray-100">
                        <h2 class="text-lg font-semibold text-blue-800">Add New Book</h2>
                    </div>
                    <form action="/books/add" method="POST" class="p-6 space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                            <input type="text" name="title" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Author</label>
                            <input type="text" name="author" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ISBN</label>
                            <input type="text" name="isbn" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition-colors">
                            Save Book
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- Books List -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-100">
                        <h2 class="text-lg font-semibold text-gray-800">Book Inventory</h2>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b border-gray-100">
                                    <th class="py-3 px-6 text-sm font-semibold text-gray-600 uppercase tracking-wider">Title & Author</th>
                                    <th class="py-3 px-6 text-sm font-semibold text-gray-600 uppercase tracking-wider">ISBN</th>
                                    <th class="py-3 px-6 text-sm font-semibold text-gray-600 uppercase tracking-wider">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                {{ for each book in books }}
                                <tr class="hover:bg-gray-50 transition-colors">
                                    <td class="py-4 px-6">
                                        <div class="font-medium text-gray-900">{{ book.title }}</div>
                                        <div class="text-sm text-gray-500">{{ book.author }}</div>
                                    </td>
                                    <td class="py-4 px-6 text-gray-600">{{ book.isbn }}</td>
                                    <td class="py-4 px-6">
                                        {{ if book.status == "Available" }}
                                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">Available</span>
                                        {{ else }}
                                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">Issued</span>
                                        {{ end }}
                                    </td>
                                </tr>
                                {{ end }}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
