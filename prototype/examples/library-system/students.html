<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - AAYU Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <nav class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-2">
                    <span class="font-bold text-xl tracking-tight">AAYU Library</span>
                </div>
                <div class="flex space-x-4">
                    <a href="/dashboard" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-500 transition-colors">Dashboard</a>
                    <a href="/books" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-500 transition-colors">Books</a>
                    <a href="/students" class="px-3 py-2 rounded-md text-sm font-medium bg-blue-700">Students</a>
                    <a href="/issue" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-500 transition-colors">Issue Book</a>
                    <a href="/logout" class="px-3 py-2 rounded-md text-sm font-medium text-blue-100 hover:text-white hover:bg-blue-800 transition-colors">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Manage Students</h1>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Add Student Form -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="bg-indigo-50 px-6 py-4 border-b border-gray-100">
                        <h2 class="text-lg font-semibold text-indigo-800">Register Student</h2>
                    </div>
                    <form action="/students/add" method="POST" class="p-6 space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                            <input type="text" name="name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                            <input type="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Student ID</label>
                            <input type="text" name="student_id" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-2.5 rounded-lg hover:bg-indigo-700 transition-colors">
                            Save Student
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- Students List -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-100">
                        <h2 class="text-lg font-semibold text-gray-800">Registered Students</h2>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b border-gray-100">
                                    <th class="py-3 px-6 text-sm font-semibold text-gray-600 uppercase tracking-wider">Name & Email</th>
                                    <th class="py-3 px-6 text-sm font-semibold text-gray-600 uppercase tracking-wider">Student ID</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                {{ for each student in students }}
                                <tr class="hover:bg-gray-50 transition-colors">
                                    <td class="py-4 px-6">
                                        <div class="font-medium text-gray-900">{{ student.name }}</div>
                                        <div class="text-sm text-gray-500">{{ student.email }}</div>
                                    </td>
                                    <td class="py-4 px-6 text-gray-600 font-mono text-sm">{{ student.student_id }}</td>
                                </tr>
                                {{ end }}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
