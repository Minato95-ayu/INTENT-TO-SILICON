<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachingPage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <div class="flex h-screen bg-gray-50 overflow-hidden w-full">
            <div class="flex flex-row flex-wrap gap-6 mb-6">
                <div class="flex flex-col gap-4 mb-6">
                    <h1 class="text-4xl font-bold text-gray-900 mb-6">AAYU Code Academy</h1>
                    <p class="text-lg text-gray-700 mb-4 leading-relaxed">Unlock the future of programming. Learn compilers, virtual machines, and AI agents.</p>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg shadow-sm transition duration-150 ease-in-out">Start Learning</button>
                </div>
            </div>
            <div class="flex flex-row flex-wrap gap-6 mb-6">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6 hover:shadow-md transition">
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-indigo-100 text-indigo-800">Beginner</span>
                    <p class="text-lg text-gray-700 mb-4 leading-relaxed">Learn AAYU syntax and memory management from zero.</p>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg shadow-sm transition duration-150 ease-in-out">Enroll</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6 hover:shadow-md transition">
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-indigo-100 text-indigo-800">Advanced</span>
                    <p class="text-lg text-gray-700 mb-4 leading-relaxed">Build autonomous agents and intent-to-silicon pipelines.</p>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg shadow-sm transition duration-150 ease-in-out">Enroll</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6 hover:shadow-md transition">
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-indigo-100 text-indigo-800">Expert</span>
                    <p class="text-lg text-gray-700 mb-4 leading-relaxed">Design scalable VMs and distributed systems.</p>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg shadow-sm transition duration-150 ease-in-out">Enroll</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
