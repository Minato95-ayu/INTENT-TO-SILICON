<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Adumate - Find your perfect college match">
    <title>Adumate | College Discovery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090b11;
            --surface: rgba(17, 22, 37, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #ec4899;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.08) 0px, transparent 50%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 48px;
            border-bottom: 1px solid var(--border);
            background: rgba(9, 11, 17, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff !important;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            text-decoration: none;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* Hero Section */
        .hero {
            padding: 80px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 56px;
            font-weight: 800;
            margin: 0 0 24px 0;
            line-height: 1.1;
            max-width: 800px;
        }

        .highlight {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 20px;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 0 40px 0;
            line-height: 1.5;
        }

        /* Colleges Grid */
        .section-title {
            text-align: center;
            font-size: 32px;
            margin: 40px 0 24px 0;
        }

        .colleges-container {
            padding: 0 48px 80px 48px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .college-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .college-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
        }

        .c-name {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: var(--text);
        }

        .c-loc {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .c-course {
            display: inline-block;
            background: rgba(99, 102, 241, 0.1);
            color: #a5b4fc;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            nav { padding: 16px 24px; }
            .hero { padding: 40px 24px; }
            .hero h1 { font-size: 40px; }
            .colleges-container { padding: 0 24px 40px 24px; }
        }
    </style>
</head>
<body>

<nav>
    <a href="/" class="logo">Adumate</a>
    <div class="nav-links">
        <a href="/login">Log In</a>
        <a href="/register" class="btn-primary">Sign Up</a>
    </div>
</nav>

<div class="hero">
    <h1>Find Your Dream College with <span class="highlight">Adumate</span></h1>
    <p>The ultimate platform to discover, research, and connect with top educational institutions across the country.</p>
    <a href="/register" class="btn-primary" style="font-size: 18px; padding: 14px 32px; border-radius: 12px;">Get Started For Free</a>
</div>

<h2 class="section-title">Explore Top Colleges</h2>
<div class="colleges-container">
    <div class="grid" id="colleges-grid">
        <!-- Injected via JS -->
    </div>
</div>

<script>
    let colleges = {{ colleges }};
    if (colleges && colleges.length > 0 && Array.isArray(colleges[0])) {
        colleges = colleges[0];
    }
    
    const grid = document.getElementById('colleges-grid');
    
    if (!colleges || colleges.length === 0) {
        grid.innerHTML = '<div style="color:var(--text-muted); text-align:center; grid-column:1/-1;">No colleges listed yet.</div>';
    } else {
        colleges.forEach(c => {
            const card = document.createElement('div');
            card.className = 'college-card';
            
            card.innerHTML = `
                <h3 class="c-name">${c.name}</h3>
                <div class="c-loc">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    ${c.location}
                </div>
                <div class="c-course">${c.course}</div>
            `;
            
            grid.appendChild(card);
        });
    }
</script>

</body>
</html>
