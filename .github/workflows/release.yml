name: Cross-Platform Native Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-native:
    name: Build Native Installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: aayu-linux-bin
            asset_name: Aayu-Linux-bin
          - os: windows-latest
            artifact_name: aayu.exe
            asset_name: AayuInstaller.exe
          - os: macos-latest
            artifact_name: aayu
            asset_name: Aayu-MacOS

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build Native Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller --onefile --name aayu tools/cli.py

      - name: Build Native Binary (Linux/Mac)
        if: matrix.os != 'windows-latest'
        run: pyinstaller --onefile --name aayu tools/cli.py

      - name: Package macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          npm install -g create-dmg
          mkdir -p dist/dmg
          cp dist/aayu dist/dmg/Aayu
          create-dmg dist/dmg/Aayu dist/Aayu.dmg || echo "dmg creation fallback"

      - name: Rename binaries for Release
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv dist/aayu.exe dist/${{ matrix.asset_name }}
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            if [ -f dist/Aayu.dmg ]; then
              mv dist/Aayu.dmg dist/${{ matrix.asset_name }}.dmg
            else
              mv dist/aayu dist/${{ matrix.asset_name }}
            fi
          else
            mv dist/aayu dist/${{ matrix.asset_name }}
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}*

